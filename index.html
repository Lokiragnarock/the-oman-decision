<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Oman decision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&family=Poppins:wght@500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== SHARED CONTRACT: section files use these classes and tokens; do not redefine them ===== */
:root{
  --ink:#16222a; --grey:#5f6b73; --hair:#e0dacf; --paper:#FBF8F3;
  --teal:#0B4F4A; --teal-2:#6F9E99; --teal-3:#D3E3E0; --sand:#C9A36A; --sand-3:#EFE3D0; --amber:#B5482E; --terra:#B5482E;
  --w:1280px; --h:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y proximity}
html,body{background:#EDE8DF;color:var(--ink);font-family:"Open Sans",system-ui,sans-serif}
.deck{display:flex;flex-direction:column;align-items:center;gap:28px;padding:28px 16px 80px}
.slide{position:relative;width:var(--w);height:var(--h);background:var(--paper);overflow:hidden;
  box-shadow:0 2px 18px rgba(20,40,50,.08);scroll-snap-align:center;flex:none}
.contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.contours path{fill:none;stroke:var(--teal);stroke-width:1}

/* chrome (R14), added by the shell */
.top{position:absolute;left:56px;right:56px;top:28px;display:flex;align-items:center;gap:14px;
  font-family:"Source Serif 4",serif;font-size:14px;color:var(--grey)}
.top .pg{color:var(--ink);font-weight:600}
.top .rule{flex:1;height:2px;background:var(--teal)}
.top .mark{font-family:"Poppins";font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--teal)}
.bar{position:absolute;left:28px;top:28px;bottom:28px;width:5px;background:var(--teal)}
.foot{position:absolute;left:56px;right:56px;bottom:22px;font-size:11px;color:var(--grey);line-height:1.4}
.foot .rule{height:1px;background:var(--teal);margin-bottom:8px;opacity:.6}
.strip{display:flex;gap:0;margin-top:8px}
.strip span{flex:1;font-family:"Poppins";font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--grey);border-top:3px solid var(--hair);padding-top:5px}
.strip span.on{color:var(--teal);border-top-color:var(--sand)}
.src{display:none}

/* content frame */
.body{position:absolute;left:56px;right:56px;top:76px;bottom:118px}
h1.t{font-weight:800;text-transform:uppercase;font-size:28px;letter-spacing:.01em;line-height:1.15;max-width:1100px}
.sub{font-size:15px;color:var(--grey);margin-top:8px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:22px}
.panel{padding-right:30px}
.panel + .panel{border-left:1px solid var(--hair);padding-left:30px}
.panel:last-child{padding-right:0}
.q{font-family:"Poppins";font-size:14px;color:var(--grey)}
.big{font-weight:800;font-size:44px;color:var(--teal);margin:4px 0 2px;line-height:1.1}
.big.amber{color:var(--amber)}
.one{font-size:14px;line-height:1.45;margin-bottom:12px}
.cap{font-size:12px;color:var(--grey);margin-bottom:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.kpi .k{font-weight:800;font-size:32px;color:var(--ink)}
.kpi .k.t{color:var(--teal)}
.kpi .l{font-size:12px;color:var(--grey);line-height:1.35}
.banner{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:11px 18px;font-size:15px}
.banner b{color:var(--sand)}

/* cover */
.cover .body{left:72px;right:72px;top:0;bottom:auto;height:396px}
.cover .kicker{position:absolute;left:0;top:112px;font-family:"Poppins";font-weight:600;color:var(--teal);letter-spacing:.16em;font-size:14px;text-transform:uppercase}
.cover h1{position:absolute;left:0;top:150px;font-family:"Source Serif 4",serif;font-weight:600;font-size:88px;line-height:1.05;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.cover .line{position:absolute;left:0;top:268px;font-size:20px;max-width:760px;line-height:1.45;color:var(--grey)}
.cover .fade{position:absolute;left:0;right:0;top:440px;height:140px;background:linear-gradient(to bottom,rgba(251,248,243,0),rgba(251,248,243,.92) 35%,rgba(251,248,243,.92) 65%,rgba(251,248,243,0))}
.cover .team{position:absolute;left:72px;top:474px;display:flex;gap:64px;font-size:13px;color:var(--grey);line-height:1.5}
.cover .team b{display:block;color:var(--ink);font-size:15px;font-weight:600}

/* contents */
.idx{display:grid;grid-template-columns:repeat(4,1fr);margin-top:44px;border-top:1px solid var(--hair)}
.idx .c{padding:22px 22px 0 0;border-right:1px solid var(--hair);margin-right:22px;min-height:360px}
.idx .c:last-child{border-right:0}
.idx .n{font-family:"Source Serif 4",serif;font-size:72px;color:var(--teal-2);line-height:1}
.idx .c.ans .n{color:var(--sand)}
.idx h3{font-family:"Poppins";font-weight:600;font-size:18px;margin:12px 0 6px;padding-bottom:8px;border-bottom:5px solid var(--teal-3)}
.idx .c.ans h3{border-bottom-color:var(--sand)}
.idx p{font-size:14px;line-height:1.5;color:#36444d}
.idx .who{margin-top:16px;font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:.08em}
.idx .rub{font-size:12px;color:var(--teal);font-weight:600}

.pending .body{display:flex;align-items:center;justify-content:center;color:var(--grey);font-family:"Poppins"}
@media (max-width:1320px){.slide{zoom:calc((100vw - 32px) / 1280px)}}
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{background:var(--paper);scroll-snap-type:none;width:1280px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .deck{padding:0;gap:0;display:block;width:1280px}
  .slide{box-shadow:none;zoom:1 !important;margin:0;width:1280px;height:720px;overflow:hidden;
    break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .tbs{background:none}
}
.tbs{display:inline-block;padding:0 4px;border:1px dashed var(--terra);color:var(--terra);font-weight:600;font-size:.92em;line-height:1.3;white-space:nowrap;border-radius:2px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>

<script>
/* Shell: loads section files in order, runs their scripts, adds chrome, draws dunes. */
const SECTIONS=["sections/00-open.html","sections/c1.html","sections/c2.html","sections/c3.html","sections/c4.html"];
const STRIP=["System","Balance","Crisis room","Verdict"];
const WHO=["","Ahimaa Dutt","Hriday Rudhra","Shreya M","Lokesh Rajan"];

function rng(s){let a=s*2654435761>>>0;return()=>{a^=a<<13;a^=a>>>17;a^=a<<5;return((a>>>0)%100000)/100000}}
function noise2(seed){
  const r=rng(seed),G=64,g=[...Array(G*G)].map(()=>r());
  const sm=t=>t*t*(3-2*t),at=(x,y)=>g[((y%G+G)%G)*G+((x%G+G)%G)];
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi);
    const a=at(xi,yi),b=at(xi+1,yi),c=at(xi,yi+1),d=at(xi+1,yi+1);
    return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}}
const SEG={1:[0,1],2:[1,2],3:[0,2],4:[2,3],5:[0,1,2,3],6:[1,3],7:[0,3],8:[3,0],9:[3,1],10:[1,2,3,0],11:[3,2],12:[2,0],13:[2,1],14:[1,0]};
function iso(field,cols,rows,S,Y0,levels){
  // marching squares; returns path data per level
  const out=[];
  for(const t of levels){let d="";
    for(let y=0;y<rows-1;y++)for(let x=0;x<cols-1;x++){
      const a=field[y*cols+x],b=field[y*cols+x+1],c=field[(y+1)*cols+x+1],e=field[(y+1)*cols+x];
      const k=(a>t)|(b>t)<<1|(c>t)<<2|(e>t)<<3; if(k===0||k===15)continue;
      const X=x*S,Y=Y0+y*S,lp=(p,q)=>(t-p)/(q-p)*S;
      const P=[[X,Y+lp(a,e)],[X+lp(a,b),Y],[X+S,Y+lp(b,c)],[X+lp(e,c),Y+S]];
      const s=SEG[k];for(let q=0;q<s.length;q+=2)d+=`M${P[s[q]][0].toFixed(1)} ${P[s[q]][1].toFixed(1)}L${P[s[q+1]][0].toFixed(1)} ${P[s[q+1]][1].toFixed(1)}`}
    out.push(d)}
  return out}
// Hook for the cover's dune band; 00-open.html may override window.drawBand(svg)
window.drawBand=window.drawBand||function(svg){
  const W=1280,H=720,S=8,Y0=400,n=noise2(41),cols=W/S+1,rows=(H-Y0)/S+1,f=[];
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const X=x*S,Y=Y0+y*S,u=(Y-Y0)/(H-Y0);
    f.push(u*u+.2*(.65*n(X/640+Y/1400,Y/190)+.35*n(X/260,Y/90+5)-.5)*(.25+u)*2)}
  const p=iso(f,cols,rows,S,Y0,[...Array(18)].map((_,L)=>-.02+L*.062));
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML=`<defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="${Y0/H}" stop-color="#FBF8F3" stop-opacity="0"/><stop offset="1" stop-color="#FBF8F3"/></linearGradient><mask id="mb"><rect width="${W}" height="${H}" fill="url(#gb)"/></mask></defs><g mask="url(#mb)"><path d="${p.join("")}" stroke-opacity=".6"/></g>`};
function drawDune(sl,i){
  const svg=sl.querySelector(".contours");if(!svg)return;
  if(sl.dataset.dune==="band"){window.drawBand(svg);return}
  const W=1280,H=720,S=8,cols=W/S+1,rows=H/S+1,n=noise2(11+i*7),f=[];
  const cfg={dense:{op:.34,levels:22,mask:0},edge:{op:.22,levels:16,mask:1},faint:{op:.12,levels:12,mask:1}}[sl.dataset.dune||"faint"];
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const X=x*S,Y=y*S;
    let v=.6*n(X/420+Y/900,Y/170)+.3*n(X/180,Y/80+3)+.1*n(X/60,Y/40+9);f.push(1-Math.abs(v*2-1)*.55+Y/H*.25)}
  const p=iso(f,cols,rows,S,0,[...Array(cfg.levels)].map((_,L)=>.45+(L+1)*(.75/cfg.levels)));
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const m=cfg.mask?`<defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1"><stop offset=".35" stop-color="#FBF8F3" stop-opacity="0"/><stop offset="1" stop-color="#FBF8F3"/></linearGradient><mask id="m${i}"><rect width="${W}" height="${H}" fill="url(#g${i})"/></mask></defs>`:"";
  svg.innerHTML=`${m}<path d="${p.join("")}" stroke-opacity="${cfg.op}" ${cfg.mask?`mask="url(#m${i})"`:""}/>`}

function chrome(sl,pg){
  if(sl.classList.contains("cover"))return;
  if(!sl.querySelector(".bar"))sl.insertAdjacentHTML("afterbegin",'<div class="bar"></div>');
  const sec=+sl.dataset.sec||0, who=sec?WHO[sec]:"";
  sl.insertAdjacentHTML("beforeend",`<div class="top"><span class="pg">${String(pg).padStart(2,"0")}</span><span>The Oman decision</span><span class="rule"></span><span class="mark">GBF CIA</span></div>`);
  const src=sl.querySelector(".src");
  sl.insertAdjacentHTML("beforeend",`<div class="foot"><div class="rule"></div>${src?src.innerHTML:""}<div class="strip">${STRIP.map((s,k)=>`<span class="${k+1===sec?"on":""}">${s}</span>`).join("")}</div></div>`);
}

(async()=>{
  const deck=document.getElementById("deck");
  for(const [k,url] of SECTIONS.entries()){
    let html="";
    try{const r=await fetch(url,{cache:"no-store"});if(r.ok)html=await r.text()}catch(e){}
    if(!html){html=`<section class="slide pending" data-sec="${k}"><div class="body">${url} is still being built</div></section>`}
    const tpl=document.createElement("template");tpl.innerHTML=html;
    const scripts=[...tpl.content.querySelectorAll("script")];scripts.forEach(s=>s.remove());
    deck.append(tpl.content);
    for(const s of scripts){const n=document.createElement("script");n.textContent=s.textContent;document.body.append(n)}
  }
  [...deck.querySelectorAll(".slide")].forEach((sl,i)=>{chrome(sl,i+1);drawDune(sl,i)});
  document.dispatchEvent(new Event("deck:ready"));
})();

// keyboard navigation
document.addEventListener("keydown",e=>{
  const k=e.key;if(!["ArrowDown","ArrowRight","PageDown"," ","ArrowUp","ArrowLeft","PageUp"].includes(k))return;
  if(/input|select|textarea/i.test(document.activeElement.tagName))return;
  e.preventDefault();
  const sl=[...document.querySelectorAll(".slide")],mid=innerHeight/2;
  let cur=sl.findIndex(s=>{const r=s.getBoundingClientRect();return r.top<=mid&&r.bottom>=mid});if(cur<0)cur=0;
  const nx=["ArrowUp","ArrowLeft","PageUp"].includes(k)?Math.max(0,cur-1):Math.min(sl.length-1,cur+1);
  sl[nx].scrollIntoView({behavior:"smooth",block:"center"});
});
</script>
</body>
</html>
